name: Debug Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        type: choice
        options:
          - windows
          - macos
          - both

permissions:
  contents: write

jobs:
  build-debug:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            label: macOS-Universal
            enabled: ${{ github.event.inputs.platform == 'macos' || github.event.inputs.platform == 'both' }}
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64
            enabled: ${{ github.event.inputs.platform == 'windows' || github.event.inputs.platform == 'both' }}

    runs-on: ${{ matrix.os }}
    if: ${{ matrix.enabled }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build Debug Tauri app
        uses: tauri-apps/tauri-action@dev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }} --debug
          releaseId: 0

      - name: Upload Debug Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jimothy-debug-${{ matrix.label }}
          path: |
            src-tauri/target/debug/bundle/**/*.exe
            src-tauri/target/debug/bundle/**/*.msi
            src-tauri/target/debug/bundle/**/*.dmg
            src-tauri/target/debug/bundle/**/*.app.tar.gz
          retention-days: 7
