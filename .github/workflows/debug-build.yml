name: Debug Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        type: choice
        options:
          - windows
          - macos
          - both

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    if: ${{ github.event.inputs.platform == 'windows' || github.event.inputs.platform == 'both' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build Debug Tauri app
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --debug
        continue-on-error: true

      - name: Upload Debug Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jimothy-debug-Windows-x64
          path: |
            src-tauri/target/debug/bundle/**/*.exe
            src-tauri/target/debug/bundle/**/*.msi
          retention-days: 7

  build-macos:
    runs-on: macos-latest
    if: ${{ github.event.inputs.platform == 'macos' || github.event.inputs.platform == 'both' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build Debug Tauri app
        run: npm run tauri build -- --target universal-apple-darwin --debug
        continue-on-error: true

      - name: Upload Debug Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jimothy-debug-macOS-Universal
          path: |
            src-tauri/target/debug/bundle/**/*.dmg
            src-tauri/target/debug/bundle/**/*.app.tar.gz
          retention-days: 7
